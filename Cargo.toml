[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/agentos-application",
  "crates/agentos-contracts",
  "crates/agentos-domain",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
agentos-application = { path = "crates/agentos-application" }
agentos-contracts = { path = "crates/agentos-contracts" }
agentos-domain = { path = "crates/agentos-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false, features = ["wry"] }
tauri-build = { version = "2" }
