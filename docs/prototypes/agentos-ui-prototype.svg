<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#dfe0d9" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e2622" flood-opacity="0.12"/>
    </filter>
    <filter id="modalShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#151a17" flood-opacity="0.24"/>
    </filter>
    <style>
      .board-title { font: 600 28px Georgia, 'Microsoft YaHei', serif; fill: #202522; }
      .board-subtitle { font: 500 13px 'Microsoft YaHei', sans-serif; fill: #737a74; }
      .frame-label { font: 700 12px 'Microsoft YaHei', sans-serif; fill: #5d655f; letter-spacing: 1px; }
      .brand { font: 700 17px Georgia, 'Microsoft YaHei', serif; fill: #202522; }
      .micro { font: 700 9px 'Microsoft YaHei', sans-serif; fill: #858b85; letter-spacing: 1px; }
      .nav-title { font: 700 12px 'Microsoft YaHei', sans-serif; fill: #29302c; }
      .button-label { font: 700 11px 'Microsoft YaHei', sans-serif; }
      .panel-kicker { font: 800 9px 'Microsoft YaHei', sans-serif; fill: #737a74; letter-spacing: 1px; }
      .panel-title { font: 500 20px Georgia, 'Microsoft YaHei', serif; fill: #202522; }
      .clock { font: 600 51px Aptos, 'Microsoft YaHei', sans-serif; fill: #202522; font-variant-numeric: tabular-nums; }
      .date { font: 500 11px 'Microsoft YaHei', sans-serif; fill: #6d746e; }
      .icon-label { font: 700 11px 'Microsoft YaHei', sans-serif; fill: #202522; text-anchor: middle; }
      .icon-meta { font: 500 9px 'Microsoft YaHei', sans-serif; fill: #737a74; text-anchor: middle; }
      .modal-title { font: 500 22px Georgia, 'Microsoft YaHei', serif; fill: #202522; }
      .body { font: 500 12px 'Microsoft YaHei', sans-serif; fill: #343b37; }
      .body-strong { font: 700 12px 'Microsoft YaHei', sans-serif; fill: #202522; }
      .status { font: 800 10px 'Microsoft YaHei', sans-serif; fill: #a56a17; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#e9e8e2"/>
  <text x="40" y="40" class="board-title">AgentOS · MVP 产品原型</text>
  <text x="40" y="65" class="board-subtitle">二维 Surface、Time Panel、App Icon 与 Agent 构建入口</text>
  <text x="1560" y="48" text-anchor="end" class="frame-label">DESIGN REVIEW · V0.1</text>

  <!-- Frame 1: Desktop -->
  <text x="40" y="92" class="frame-label">01 / 桌面与应用入口</text>
  <g transform="translate(40 108)">
    <rect width="740" height="480" rx="8" fill="#f7f6f1" stroke="#bfc3bb" filter="url(#shadow)"/>
    <rect x="1" y="1" width="738" height="54" rx="7" fill="#f9f8f4"/>
    <path d="M1 55H739" stroke="#c9ccc4"/>
    <g transform="translate(20 15)">
      <rect width="11" height="11" fill="#202522"/><rect x="14" width="11" height="11" fill="#2f6f62"/>
      <rect y="14" width="11" height="11" fill="#2f6f62"/><rect x="14" y="14" width="11" height="11" fill="#202522"/>
      <text x="36" y="18" class="brand">AgentOS</text>
    </g>
    <text x="370" y="33" class="nav-title" text-anchor="middle">桌面</text>
    <g transform="translate(410 11)">
      <rect width="70" height="32" rx="6" fill="#ecece6" stroke="#d4d6cf"/>
      <path d="M13 16h10M18 11v10M13 16l3-3M13 16l3 3M23 16l-3-3M23 16l-3 3M18 11l-3 3M18 11l3 3M18 21l-3-3M18 21l3-3" fill="none" stroke="#343b37" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="47" y="20" class="button-label" fill="#343b37" text-anchor="middle">移动到</text>
    </g>
    <g transform="translate(488 11)">
      <rect width="70" height="32" rx="6" fill="#ecece6" stroke="#d4d6cf"/>
      <rect x="12" y="9" width="10" height="11" rx="1" fill="none" stroke="#343b37" stroke-width="1.3"/>
      <rect x="16" y="13" width="10" height="11" rx="1" fill="#ecece6" stroke="#343b37" stroke-width="1.3"/>
      <text x="47" y="20" class="button-label" fill="#343b37" text-anchor="middle">复制为</text>
    </g>
    <g transform="translate(566 11)">
      <rect width="76" height="32" rx="6" fill="#f5e8e5" stroke="#e1c6c0"/>
      <path d="M14 10v13M10 12h8M12 8h4M12 12v9M16 12v9" fill="none" stroke="#a84237" stroke-width="1.4" stroke-linecap="round"/>
