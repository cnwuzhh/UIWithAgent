      <path d="M14 16h10M19 11v10" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
      <text x="47" y="20" class="button-label" fill="white" text-anchor="middle">构建</text>
    </g>
    <rect x="1" y="56" width="738" height="394" fill="#eeeee8"/>
    <rect x="1" y="56" width="738" height="394" fill="url(#grid)"/>
    <text x="20" y="78" class="micro">SURFACE / LONDON</text>
    <text x="720" y="78" text-anchor="end" class="micro">12 × 8 GRID</text>
    <g transform="translate(140 142)" filter="url(#shadow)">
      <rect width="460" height="220" rx="8" fill="#fbfaf6" stroke="#c4c8c0"/>
      <rect width="460" height="4" rx="2" fill="#366b8c"/>
      <text x="25" y="33" class="panel-kicker">WORLD CLOCK</text>
      <circle cx="425" cy="30" r="11" fill="none" stroke="#366b8c" stroke-width="1.7"/>
      <path d="M425 23v8l6 3" fill="none" stroke="#366b8c" stroke-width="1.7" stroke-linecap="round"/>
