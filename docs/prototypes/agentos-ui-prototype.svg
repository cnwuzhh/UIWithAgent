  <text x="820" y="92" class="frame-label">02 / 城市时间 Surface</text>
  <g transform="translate(820 108)">
    <rect width="740" height="480" rx="8" fill="#f7f6f1" stroke="#bfc3bb" filter="url(#shadow)"/>
