      <text x="435" y="190" text-anchor="end" class="date">Europe/London</text>
    </g>
    <rect x="1" y="450" width="738" height="29" fill="#f7f6f1"/>
    <circle cx="22" cy="465" r="4" fill="#43836c"/>
    <text x="32" y="469" class="micro">本地运行</text>
    <text x="718" y="469" text-anchor="end" class="micro">没有活动任务</text>
  </g>

  <!-- Frame 3: Build dialog -->
  <text x="40" y="637" class="frame-label">03 / Agent 构建入口</text>
  <g transform="translate(40 653)">
    <rect width="740" height="507" rx="8" fill="#f7f6f1" stroke="#bfc3bb" filter="url(#shadow)"/>
    <rect x="1" y="1" width="738" height="54" rx="7" fill="#f9f8f4"/>
    <path d="M1 55H739" stroke="#c9ccc4"/>
    <text x="24" y="33" class="brand">AgentOS</text>
    <text x="370" y="33" class="nav-title" text-anchor="middle">桌面</text>
    <rect x="1" y="56" width="738" height="450" fill="#252b27" opacity="0.46"/>
    <rect x="1" y="56" width="738" height="450" fill="url(#grid)" opacity="0.22"/>
    <g transform="translate(127 92)" filter="url(#modalShadow)">
