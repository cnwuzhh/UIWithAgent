    <rect x="1" y="56" width="738" height="394" fill="url(#grid)"/>
    <text x="20" y="78" class="micro">SURFACE / DESKTOP</text>
    <text x="720" y="78" text-anchor="end" class="micro">12 × 8 GRID</text>

    <g transform="translate(48 101)" filter="url(#shadow)">
      <rect width="368" height="178" rx="8" fill="#fbfaf6" stroke="#c4c8c0"/>
      <rect width="368" height="4" rx="2" fill="#2f6f62"/>
      <text x="22" y="30" class="panel-kicker">LOCAL TIME</text>
      <circle cx="337" cy="27" r="10" fill="none" stroke="#2f6f62" stroke-width="1.6"/>
      <path d="M337 21v7l5 3" fill="none" stroke="#2f6f62" stroke-width="1.6" stroke-linecap="round"/>
      <text x="22" y="61" class="panel-title">当地时间</text>
      <text x="22" y="116" class="clock">21:36:08</text>
      <text x="22" y="151" class="date">2026 年 10 月 8 日 · 星期四</text>
      <text x="346" y="151" text-anchor="end" class="date">Asia/Shanghai</text>
    </g>

    <g transform="translate(62 328)">
      <g>
        <rect x="-8" y="-8" width="82" height="116" rx="8" fill="#f7faf8" stroke="#2f6f62" stroke-width="1.5" stroke-dasharray="4 3"/>
        <rect x="2" width="62" height="62" rx="8" fill="#faf9f5" stroke="#c3c7bf"/>
        <rect x="2" y="58" width="62" height="4" fill="#366b8c"/>
        <circle cx="33" cy="28" r="15" fill="none" stroke="#366b8c" stroke-width="2"/>
        <path d="M33 18v11l7 4" fill="none" stroke="#366b8c" stroke-width="2" stroke-linecap="round"/>
        <text x="33" y="82" class="icon-label">伦敦时间</text>
        <text x="33" y="98" class="icon-meta">打开时钟</text>
        <circle cx="67" cy="-7" r="8" fill="#2f6f62"/>
        <path d="M63 -7l3 3 5-6" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="translate(105)">
        <rect x="2" width="62" height="62" rx="8" fill="#faf9f5" stroke="#c3c7bf"/>
        <rect x="2" y="58" width="62" height="4" fill="#b15d3b"/>
        <circle cx="33" cy="28" r="15" fill="none" stroke="#b15d3b" stroke-width="2"/>
        <path d="M33 18v11l7 4" fill="none" stroke="#b15d3b" stroke-width="2" stroke-linecap="round"/>
        <text x="33" y="82" class="icon-label">洛杉矶时间</text>
        <text x="33" y="98" class="icon-meta">打开时钟</text>
      </g>
      <g transform="translate(210)">
        <rect x="2" width="62" height="62" rx="8" fill="#fff8e9" stroke="#d8be8e"/>
        <rect x="2" y="58" width="62" height="4" fill="#b7791f"/>
        <circle cx="33" cy="28" r="15" fill="none" stroke="#b7791f" stroke-width="2" stroke-dasharray="7 4"/>
        <path d="M33 13v6M33 37v6M18 28h6M42 28h6" stroke="#b7791f" stroke-width="1.5"/>
        <text x="33" y="82" class="icon-label">当地天气</text>
        <text x="33" y="98" class="icon-meta" fill="#a56a17">构建中</text>
      </g>
    </g>
    <rect x="1" y="450" width="738" height="29" fill="#f7f6f1"/>
    <circle cx="22" cy="465" r="4" fill="#43836c"/>
    <text x="32" y="469" class="micro">本地运行</text>
    <text x="718" y="469" text-anchor="end" class="micro">1 个构建任务</text>
  </g>

