      <rect x="24" y="249" width="119" height="25" rx="4" fill="#f0f0ea" stroke="#d0d3cb"/>
      <path d="M37 256c-4 0-6 3-6 6 0 5 6 9 6 9s6-4 6-9c0-3-2-6-6-6z" fill="none" stroke="#6d746e" stroke-width="1.2"/>
      <circle cx="37" cy="262" r="2" fill="#6d746e"/>
      <text x="50" y="266" class="date">当前上下文：桌面</text>
      <path d="M0 299H486" stroke="#d3d6ce"/>
      <rect x="290" y="317" width="72" height="36" rx="6" fill="#e9e9e3"/>
      <text x="326" y="340" class="button-label" fill="#343b37" text-anchor="middle">取消</text>
      <rect x="374" y="317" width="88" height="36" rx="6" fill="#2f6f62"/>
      <path d="M389 328l9 9M398 328l-9 9" stroke="white" stroke-width="1.4" transform="rotate(45 393.5 332.5)"/>
      <text x="426" y="340" class="button-label" fill="white" text-anchor="middle">开始构建</text>
    </g>
  </g>

  <!-- Frame 4: Task dialog -->
  <text x="820" y="637" class="frame-label">04 / 构建任务详情</text>
  <g transform="translate(820 653)">
    <rect width="740" height="507" rx="8" fill="#f7f6f1" stroke="#bfc3bb" filter="url(#shadow)"/>
    <rect x="1" y="1" width="738" height="54" rx="7" fill="#f9f8f4"/>
