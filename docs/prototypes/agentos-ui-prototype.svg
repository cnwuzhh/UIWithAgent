      <text x="72" y="261" class="body-strong" fill="#24584e">收到</text>
      <text x="24" y="309" class="date">创建于 2026-10-08 21:36</text>
      <path d="M0 326H466" stroke="#d3d6ce"/>
      <rect x="344" y="342" width="98" height="34" rx="6" fill="#f5e8e5"/>
      <path d="M361 351v15M356 354h10M359 349h4" fill="none" stroke="#a84237" stroke-width="1.4" stroke-linecap="round"/>
